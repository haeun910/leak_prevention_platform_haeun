# 하루 한 번 백엔드 /api/health를 호출해
# Supabase 무료 플랜의 비활성 일시정지(7일)와 Hugging Face Space 잠들기를 막는다.
# 백엔드 주소는 저장소 Settings → Secrets and variables → Actions → Variables의 BACKEND_URL로 지정.
name: Keep backend alive

on:
  schedule:
    - cron: "17 0 * * *" # 매일 09:17 (KST)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL 변수가 설정되지 않았습니다." && exit 1
          fi
          # 잠든 Space가 깨어나는 데 시간이 걸리므로 최대 5분 동안 재시도
          for i in $(seq 1 10); do
            if curl -fsS --max-time 30 "$BACKEND_URL/api/health"; then
              echo && echo "OK" && exit 0
            fi
            echo "재시도 $i/10..." && sleep 30
          done
          exit 1
